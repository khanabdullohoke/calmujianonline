<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guru · Sistem Ujian Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><span class="mark">U</span> Panel Guru</div>
    <div class="who">
      <span id="whoBadge"></span>
      <button class="btn-logout" id="logoutBtn">Keluar</button>
    </div>
  </div>

  <div class="main" id="mainArea">

    <!-- ===== TAB: UJIAN & SOAL ===== -->
    <section id="tab-ujian">
      <div class="flex-between mb-16">
        <h2 style="font-size:17px;">Ujian Saya</h2>
        <button class="btn btn-amber btn-sm" id="btnShowForm">+ Buat Ujian</button>
      </div>

      <div class="card mb-16" id="formUjian" style="display:none;">
        <div class="field"><label>Judul Ujian</label><input id="ujJudul" placeholder="Ulangan Harian Bab 3 - Algoritma"></div>
        <div class="grid grid-2">
          <div class="field"><label>Durasi (menit)</label><input id="ujDurasi" type="number" value="60" min="1"></div>
          <div class="field"><label>Acak urutan soal?</label>
            <select id="ujAcak"><option value="ya">Ya, acak</option><option value="tidak">Tidak, berurutan</option></select>
          </div>
        </div>
        <div class="field">
          <label>Berlaku untuk Kelas</label>
          <div id="ujKelasList" class="hint">Memuat daftar kelas...</div>
        </div>
        <div id="ujErr" class="error-box"></div>
        <div class="flex gap-8">
          <button class="btn btn-primary" id="btnSaveUjian">Simpan Ujian</button>
          <button class="btn btn-outline" id="btnCancelForm">Batal</button>
        </div>
      </div>

      <div id="listUjian"></div>
      <div class="empty" id="ujianEmpty" style="display:none;"><div class="ic">📝</div>Belum ada ujian. Klik "+ Buat Ujian".</div>
    </section>

    <!-- ===== TAB: REKAP HASIL ===== -->
    <section id="tab-hasil" style="display:none;">
      <h2 style="font-size:17px;" class="mb-16">Rekap Hasil Ujian</h2>
      <div class="card mb-16">
        <div class="grid grid-2">
          <div class="field"><label>Pilih Ujian</label><select id="hasilUjianSelect"><option value="">Pilih...</option></select></div>
          <div class="field"><label>Filter Kelas / Jurusan</label><select id="hasilKelasFilter"><option value="">Semua kelas</option></select></div>
        </div>
      </div>
      <div id="ringkasanHasil" class="grid grid-3 mb-16"></div>
      <div class="card">
        <div class="table-wrap">
          <table id="tblHasil">
            <thead><tr><th>Nama Siswa</th><th>Kelas</th><th>Jurusan</th><th>Nilai</th><th>Selesai</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="empty" id="hasilEmpty" style="display:none;"><div class="ic">📊</div>Belum ada siswa yang mengerjakan ujian ini.</div>
      </div>
    </section>

  </div>

  <div class="tabbar">
    <button class="active" data-tab="ujian"><span class="ic">📝</span>Ujian & Soal</button>
    <button data-tab="hasil"><span class="ic">📊</span>Rekap Hasil</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/guru.js"></script>
</body>
</html>
